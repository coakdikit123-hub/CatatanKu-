<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>Admin - CatatanKu</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        body {
            background-color: #0f1420;
            color: #e8edf5;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #1a2238; border: 1px solid #B1BCFB; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.15s; }
        .btn-danger { background: #DF172A; color: white; }
        .btn-danger:hover { transform: scale(1.02); }
        .btn-primary { background: #B1BCFB; color: #0f1420; }
        .btn-primary:hover { transform: scale(1.02); }
        input { background: #0f1420; border: 1px solid #2a3550; color: #e8edf5; padding: 10px 14px; border-radius: 8px; width: 100%; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #2a3550; }
        .user-item:last-child { border-bottom: none; }
        .token-input { display: flex; gap: 10px; margin-bottom: 16px; }
        .token-input input { flex: 1; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #1e2740; color: #e8edf5; padding: 12px 24px; border-radius: 12px;
            font-weight: 500; font-size: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            opacity: 0; transition: all 0.35s ease; z-index: 999; pointer-events: none; white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    <div class="container">
        <h1 class="text-2xl font-bold text-primary mb-4">🔐 Admin Panel</h1>
        <div class="card">
            <h2 class="text-lg font-semibold mb-3">Masukkan Token Admin</h2>
            <div class="token-input">
                <input id="admin-token" type="password" placeholder="Admin Token" />
                <button class="btn btn-primary" onclick="loginAdmin()">Login</button>
            </div>
            <div id="login-status" class="text-sm" style="color:#94a3bb;"></div>
        </div>

        <div id="admin-content" style="display:none;">
            <div class="card">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">📋 Daftar User</h2>
                    <button class="btn btn-primary" onclick="loadUsers()">🔄 Refresh</button>
                </div>
                <div id="user-list">
                    <p class="text-outline">Memuat...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let adminToken = '';

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
        }

        function loginAdmin() {
            const token = document.getElementById('admin-token').value.trim();
            if (!token) {
                showToast('⚠️ Masukkan token');
                return;
            }
            adminToken = token;
            document.getElementById('login-status').textContent = '✅ Token diterima, memuat data...';
            document.getElementById('admin-content').style.display = 'block';
            loadUsers();
        }

        async function loadUsers() {
            if (!adminToken) return;
            const list = document.getElementById('user-list');
            list.innerHTML = '<p class="text-outline">Memuat...</p>';
            try {
                const res = await fetch(`${API_BASE}/api/admin/users`, {
                    headers: { 'x-admin-token': adminToken }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        list.innerHTML = '<p class="text-error">❌ Token tidak valid. Login ulang.</p>';
                        document.getElementById('admin-content').style.display = 'none';
                        document.getElementById('login-status').textContent = '❌ Token tidak valid';
                        return;
                    }
                    throw new Error('Gagal memuat');
                }
                const data = await res.json();
                if (data.users.length === 0) {
                    list.innerHTML = '<p class="text-outline">Belum ada user terdaftar.</p>';
                } else {
                    list.innerHTML = data.users.map(u => `
                        <div class="user-item">
                            <div>
                                <span class="font-mono">${u.userId}</span>
                                <span class="text-sm text-outline ml-3">${u.count} transaksi</span>
                            </div>
                            <button class="btn btn-danger" onclick="deleteUser('${u.userId}')">Hapus Sesi</button>
                        </div>
                    `).join('');
                }
            } catch (e) {
                list.innerHTML = `<p class="text-error">❌ Error: ${e.message}</p>`;
            }
        }

        async function deleteUser(userId) {
            if (!confirm(`Hapus semua data user ${userId}?`)) return;
            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-token': adminToken }
                });
                if (!res.ok) {
                    if (res.status === 401) {
                        showToast('❌ Token tidak valid');
                        return;
                    }
                    throw new Error('Gagal hapus');
                }
                showToast(`✅ Data user ${userId} dihapus`);
                loadUsers();
            } catch (e) {
                showToast(`❌ ${e.message}`);
            }
        }
    </script>
</body>
</html>
